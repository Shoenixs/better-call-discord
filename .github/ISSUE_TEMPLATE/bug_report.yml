name: Bug report
description: Report a Better Call Discord issue (English or Russian)
body:
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: Plugin, Discord and BetterDiscord versions, plus your operating system.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps, expected behavior and actual behavior. English and Russian are welcome.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Does Listen work? What is the connection status? Remove personal paths, tokens and message content.
